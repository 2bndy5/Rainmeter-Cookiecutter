# This is a basic workflow to help you get started with Actions
name: RMSKIN Packager

on:
  push:
    branches: [main, master]
    tags:
      - "*"
  pull_request:
    branches: [main, master]

jobs:
  Build_n_Release:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout this Repo
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      # Runs a rmskin packager action
      - name: Run Build action
        id: builder
        uses: 2bndy5/rmskin-action@8a88b10c5b4ac8d0df015800eae8a12ee53c5fe2 # v2.0.2

      # upload the output from the `builder` step as workflow artifact
      - name: Archive rmskin file as artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ steps.builder.outputs.arc-name }}
          path: ${{ steps.builder.outputs.arc-name }}
          if-no-files-found: error

      # Upload the asset
      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${TAG}" "${ASSET_PATH}"
        env:
          TAG: ${{ github.ref_name }}
          ASSET_PATH: ${{ steps.builder.outputs.arc-name }}
          GITHUB_TOKEN: ${{ github.token }}
